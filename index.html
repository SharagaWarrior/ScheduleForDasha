<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Розклад — Перший курс</title>
  <meta name="description" content="Розклад занять першого курсу, групи 1-1, 1-2 та 1-3">
  <style>
    :root{
      --bg:#f5f7fb;
      --panel:#ffffff;
      --text:#172033;
      --muted:#657089;
      --line:#e5eaf2;
      --accent:#315efb;
      --accent-soft:#eef2ff;
      --shadow:0 12px 30px rgba(21,34,58,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#f7f9fc 0%,#f2f5fa 100%);
      color:var(--text);
    }
    button{font:inherit}
    .wrap{max-width:1180px;margin:0 auto;padding:28px 18px 48px}
    header{
      display:flex;justify-content:space-between;gap:20px;align-items:flex-end;
      margin-bottom:22px;
    }
    .eyebrow{
      display:inline-flex;align-items:center;gap:8px;
      font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
      color:var(--accent);margin-bottom:8px;
    }
    .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
    h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:-.035em}
    .subtitle{margin:7px 0 0;color:var(--muted);font-size:15px}
    .controls{display:flex;flex-wrap:wrap;gap:9px}
    .seg{
      border:1px solid var(--line);background:#fff;color:var(--muted);
      padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:750;
      box-shadow:0 3px 10px rgba(18,31,54,.04);
      transition:.18s ease;
    }
    .seg:hover{transform:translateY(-1px)}
    .seg.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 8px 18px rgba(49,94,251,.22)}
    .day-tabs{
      display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
      padding:7px;background:#edf1f7;border-radius:16px;margin:0 0 20px;
      position:sticky;top:10px;z-index:10;
    }
    .day-tab{
      border:0;background:transparent;color:#5f6b80;padding:11px 8px;border-radius:11px;
      font-weight:800;cursor:pointer;
    }
    .day-tab.active{background:#fff;color:var(--text);box-shadow:0 4px 14px rgba(21,34,58,.07)}
    .day-label{display:block;font-size:13px}
    .day-date{display:block;font-size:11px;color:#8c96a8;margin-top:3px;font-weight:700}
    .day-tab.active .day-date{color:var(--accent)}
    .day-title{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      margin:18px 0 12px;
    }
    .day-title h2{margin:0;font-size:24px;letter-spacing:-.02em}
    .badge{
      padding:7px 10px;background:#fff;border:1px solid var(--line);color:var(--muted);
      border-radius:999px;font-size:12px;font-weight:800;
    }
    .schedule{display:grid;gap:12px}
    .lesson{
      display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:stretch;
    }
    .period{
      background:#111a2e;color:#fff;border-radius:16px;padding:14px 10px;
      display:flex;flex-direction:column;justify-content:center;align-items:center;
      min-height:150px;
    }
    .period .n{font-size:24px;font-weight:900;line-height:1}
    .period .t{font-size:11px;margin-top:7px;opacity:.85;text-align:center;line-height:1.35}
    .period .t + .t{margin-top:3px;font-size:10px;opacity:.68}
    .lesson-card{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
      padding:17px 18px;box-shadow:var(--shadow);
      min-width:0;
    }
    .lesson-card.empty{
      background:transparent;border:1px dashed #d7dee9;box-shadow:none;color:#909bad;
      display:flex;align-items:center;justify-content:center;min-height:150px;font-weight:750;
    }
    .lesson-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
    .course{font-size:18px;font-weight:900;letter-spacing:-.015em}
    .kind{font-size:11px;color:var(--accent);font-weight:850;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
    .meta{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.55}
    .meta strong{color:#38445a}
    .groups{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:13px
    }
    .group{
      border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#fbfcfe
    }
    .group.active{
      border-color:#cbd5ff;background:var(--accent-soft)
    }
    .group .gname{font-weight:900;font-size:12px;margin-bottom:7px;color:#26324a}
    .group .gtext{font-size:13px;line-height:1.45;color:#4f5c72;white-space:pre-line}
    .room{margin-top:10px;display:inline-block;background:#f2f5f9;padding:6px 9px;border-radius:9px;font-size:12px;font-weight:850;color:#536077}
    .notes{
      margin-top:20px;color:var(--muted);font-size:12px;line-height:1.55;
      padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff
    }
    .mobile-group{display:none}
    @media (max-width:760px){
      .wrap{padding:20px 12px 40px}
      header{display:block}
      .controls{margin-top:15px}
      .day-tabs{position:static;overflow-x:auto;display:flex}
      .day-tab{min-width:96px}
      .lesson{grid-template-columns:62px 1fr}
      .period{min-height:135px;border-radius:13px;padding:9px 5px}
      .period .n{font-size:21px}
      .lesson-card{padding:14px}
      .groups{grid-template-columns:1fr}
      .course{font-size:16px}
      .kind{display:none}
    }
  </style>
</head>
<body>

      <h1>Розклад занять</h1>
      <p class="subtitle">Групи 1-1, 1-2 та 1-3 · академічні пари I–IV</p>
    </div>
    <div class="controls" aria-label="Вибір групи">
      <button class="seg active" data-group="all">Усі групи</button>
      <button class="seg" data-group="1-1">1-1</button>
      <button class="seg" data-group="1-2">1-2</button>
      <button class="seg" data-group="1-3">1-3</button>
    </div>
  </header>

  <nav class="day-tabs" aria-label="Дні тижня">
    <button class="day-tab active" data-day="monday"><span class="day-label">Понеділок</span><span class="day-date">I–IV</span></button>
    <button class="day-tab" data-day="tuesday"><span class="day-label">Вівторок</span><span class="day-date">I–IV</span></button>
    <button class="day-tab" data-day="wednesday"><span class="day-label">Середа</span><span class="day-date">I–IV</span></button>
    <button class="day-tab" data-day="thursday"><span class="day-label">Четвер</span><span class="day-date">I–IV</span></button>
    <button class="day-tab" data-day="friday"><span class="day-label">П'ятниця</span><span class="day-date">I–IV</span></button>
  </nav>

  <main id="app"></main>

  <div class="notes">
    <strong>Примітка.</strong> Розклад перенесено з наданого фото. Позначення на кшталт «2–13т.», «7–13т.» та «практ.з» залишені максимально близько до оригіналу. Порожні аудиторії у вихідному зображенні позначені як «ауд. —».
  </div>
</div>

const romanNames = {
  I:"I пара",
  II:"II пара",
  III:"III пара",
  IV:"IV пара"
};
const periodTimes = {
  I:"08:00 – 09:20",
  II:"09:30 – 10:50",
  III:"11:20 – 12:40",
  IV:"12:50 – 14:10"
};
const breakTimes = {
  I:"10 хв. перерва",
  II:"30 хв. велика перерва",
  III:"10 хв. перерва",
  IV:"10 хв. перерва"
};
let selectedGroup = "all";
let selectedDay = "monday";

function visibleGroups(lesson){
  return selectedGroup === "all"
    ? ["1-1","1-2","1-3"]
    : [selectedGroup];
}

function render(){
  const day = schedule[selectedDay];
  document.getElementById("app").innerHTML = `
    <section>
      <div class="day-title">
        <h2>${day.title}</h2>
        <span class="badge">${selectedGroup === "all" ? "усі групи" : "група " + selectedGroup}</span>
      </div>
      <div class="schedule">
        ${day.lessons.map(lesson => {
          if(lesson.empty){
            return `
              <div class="lesson">
                <div class="period">
                  <div class="n">${lesson.p}</div>
                  <div class="t">${periodTimes[lesson.p]}</div>
                  <div class="t">${breakTimes[lesson.p]}</div>
                </div>
                <div class="lesson-card empty">Вільно / занять немає</div>
              </div>`;
          }
          return `
            <div class="lesson">
              <div class="period">
                <div class="n">${lesson.p}</div>
                <div class="t">${periodTimes[lesson.p]}</div>
                <div class="t">${breakTimes[lesson.p]}</div>
              </div>
              <article class="lesson-card">
                <div class="lesson-head">
                  <div>
                    <div class="course">${lesson.course}</div>
                    ${lesson.info ? `<div class="meta">${lesson.info}</div>` : ""}
                  </div>
                  <div class="kind">${lesson.kind}</div>
                </div>
                ${lesson.commonRoom ? `<div class="room">${lesson.commonRoom}</div>` : ""}
                <div class="groups">
                  ${visibleGroups(lesson).map(g => `
                    <div class="group ${selectedGroup===g ? "active":""}">
                      <div class="gname">Група ${g}</div>
                      <div class="gtext">${lesson.groups[g] || "—"}</div>
                    </div>
                  `).join("")}
                </div>
              </article>
            </div>`;
        }).join("")}
      </div>
    </section>`;
}

document.querySelectorAll(".seg").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".seg").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    selectedGroup = btn.dataset.group;
    render();
  });
});
document.querySelectorAll(".day-tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".day-tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    selectedDay = btn.dataset.day;
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  });
});

render();
</script>
</body>
</html>
